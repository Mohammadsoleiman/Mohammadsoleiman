<!--?xml version="1.0" encoding="UTF-8"?-->
<svg width="320" height="320" viewBox="0 0 512 512" role="img" aria-label="MS circular monogram" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6A5ACD"></stop>
      <stop offset="100%" stop-color="#3A7BFF"></stop>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#grad)" stroke-width="12" filter="url(#softGlow)"></circle>
  <text x="256" y="276" font-family="Inter, Poppins, Segoe UI, Roboto, Arial, sans-serif" font-weight="800" font-size="110" text-anchor="middle" fill="url(#grad)" filter="url(#softGlow)">MS</text>
</svg>
